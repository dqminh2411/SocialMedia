services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${DB_PORT}:3306"
    volumes:
      # The Persistence Magic
      # Maps "./mysql_data" on your PC to the MySQL storage folder in the container
      - ./mysql_data:/var/lib/mysql
    networks:
      - my_network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - my_network

  backend:
    build: ./backend
    image: social-backend
    container_name: social-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BE_PORT}:8080"
    networks:
      - my_network

    
  frontend:
    build: ./frontend
    image: social-frontend
    container_name: social-frontend
    ports:
      - "${FE_PORT}:3000"
    depends_on:
      - backend
    networks:
      - my_network
networks:
  my_network:
    external: false
